[www]
user = www-data
group = www-data
listen = 9000

; Dynamic process manager - scales workers up/down based on load
pm = dynamic

; Maximum number of child processes
pm.max_children = 50

; Number of workers created on startup
pm.start_servers = 10

; Minimum idle workers kept alive
pm.min_spare_servers = 5

; Maximum idle workers before killing them
pm.max_spare_servers = 20

; Recycle workers after this many requests to prevent memory leaks
pm.max_requests = 500

; Log slow requests (> 10s) for diagnosis
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Ensure errors go to stderr (visible in docker logs)
php_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
