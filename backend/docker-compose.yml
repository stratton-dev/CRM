services:
  laravel-php:
    user: "33:33"
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: laravel-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./website:/var/www/html:delegated
      - ./php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    networks:
      - stratton
    extra_hosts:
      - "host.docker.internal:host-gateway"

  laravel-nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    depends_on:
      - laravel-php
    volumes:
      - ./website:/var/www/html:delegated
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - stratton
    expose:
      - "80"
    labels:
      - "traefik.enable=true"

      # ROUTER
      - "traefik.http.routers.laravel-api.rule=Host(`api.stratton.pl`)"
      - "traefik.http.routers.laravel-api.entrypoints=websecure"
      - "traefik.http.routers.laravel-api.tls.certresolver=le"

      # SERVICE
      - "traefik.http.services.laravel-api.loadbalancer.server.port=80"

  laravel-reverb:
    user: "33:33"
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: laravel-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./website:/var/www/html:delegated
      - ./php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    networks:
      - stratton
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"

      # ROUTER
      - "traefik.http.routers.laravel-reverb.rule=Host(`reverb.stratton.pl`)"
      - "traefik.http.routers.laravel-reverb.entrypoints=websecure"
      - "traefik.http.routers.laravel-reverb.tls.certresolver=le"

      # SERVICE
      - "traefik.http.services.laravel-reverb.loadbalancer.server.port=8080"

networks:
  stratton:
    external: true
