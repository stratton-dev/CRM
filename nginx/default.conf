server {
  listen 80;
  server_name _;

  root /var/www/html/public;
  index index.php;

  # Laravel routing + CORS preflight
  location / {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, X-XSRF-TOKEN' always;
      add_header 'Access-Control-Max-Age' 1728000;
      return 204;
    }
    try_files $uri $uri/ /index.php?$query_string;
  }

  # PHP-FPM — CORS headers must be here (add_header in location / doesn't survive try_files internal redirect)
  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass laravel-php:9000;
    fastcgi_read_timeout 300;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With, X-XSRF-TOKEN' always;
  }

  # Bezpieczne ukrycie plików
  location ~ /\.(?!well-known).* {
    deny all;
  }

  client_max_body_size 50m;
}
